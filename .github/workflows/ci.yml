name: CI

on:
    push:
    pull_request:

jobs:
    quality:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: astral-sh/setup-uv@v6
              with:
                  version: "0.8.4"
            - uses: actions/setup-python@v6
              with:
                  python-version: "3.13"
            - run: uv sync --dev
            - run: uv run ruff check .
            - run: uv run mypy src
            - run: uv run pytest
